name: PhotoGuide
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GuidanceCore:
    path: Packages/GuidanceCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CLANG_ENABLE_MODULES: YES


targets:
  CameraRuntime:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Packages/CameraRuntime/CameraRuntime.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.CameraRuntime
      PRODUCT_NAME: CameraRuntime
      GENERATE_INFOPLIST_FILE: YES

  PerceptionRuntime:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Packages/PerceptionRuntime/PerceptionRuntime.swift
    dependencies:
      - package: GuidanceCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.PerceptionRuntime
      PRODUCT_NAME: PerceptionRuntime
      GENERATE_INFOPLIST_FILE: YES

  RecipeKit:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Packages/RecipeKit/RecipeKit.swift
      - path: Packages/RecipeKit/Resources
        buildPhase: resources
    dependencies:
      - package: GuidanceCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.RecipeKit
      PRODUCT_NAME: RecipeKit
      GENERATE_INFOPLIST_FILE: YES

  GuidanceUI:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Packages/GuidanceUI
        excludes:
          - Resources
      - path: Packages/GuidanceUI/Resources
        buildPhase: resources
    dependencies:
      - target: CameraRuntime
      - target: PerceptionRuntime
      - target: RecipeKit
      - package: GuidanceCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.GuidanceUI
      PRODUCT_NAME: GuidanceUI
      GENERATE_INFOPLIST_FILE: YES

  PhotoGuideApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PhotoGuideApp
        excludes:
          - Resources
      - path: PhotoGuideApp/Resources
        buildPhase: resources
    dependencies:
      - target: GuidanceUI
        embed: true
      - target: CameraRuntime
        embed: true
      - target: PerceptionRuntime
        embed: true
      - target: RecipeKit
        embed: true
      - package: GuidanceCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.app
      PRODUCT_NAME: PhotoGuide
      MARKETING_VERSION: 0.4.4
      CURRENT_PROJECT_VERSION: 14
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: PhotoGuide
      INFOPLIST_KEY_CFBundleDevelopmentRegion: en
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSCameraUsageDescription: PhotoGuide uses the camera for live framing analysis and real-time shooting guidance.
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: PhotoGuide needs permission to save captured photos to your Photo Library.
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent

  RecipeKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/RecipeKitTests.swift
    dependencies:
      - target: RecipeKit
      - package: GuidanceCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.RecipeKitTests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO

  PerceptionRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/PerceptionRuntimeTests.swift
    dependencies:
      - target: PerceptionRuntime
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.PerceptionRuntimeTests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO

  PhotoGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/PhotoGuideUITests.swift
    dependencies:
      - target: PhotoGuideApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.photoguide.PhotoGuideUITests
      TEST_TARGET_NAME: PhotoGuideApp
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO

schemes:
  PhotoGuideApp:
    build:
      targets:
        PhotoGuideApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecipeKitTests
        - PerceptionRuntimeTests
        - PhotoGuideUITests
